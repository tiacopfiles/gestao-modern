openapi: 3.0.3
info:
  title: API de Integração Financeira ACOP
  version: 1.1.0
  description: |
    API servidor-servidor para entrada e consulta de Payables, Receivables e fatos bancários.
    O Bearer token determina o sistema de origem. Toda mutação exige
    `Idempotency-Key`; `X-Correlation-ID` é opcional e sempre é devolvido.
servers:
  - url: http://localhost/api/v1
    description: Ambiente local; produção deve usar HTTPS
security:
  - bearerAuth: []
tags:
  - name: Payables
  - name: Receivables
  - name: Bank Transactions
  - name: Bank Imports
paths:
  /payables:
    post:
      tags: [Payables]
      summary: Criar ou reingerir uma conta a pagar
      description: Exige o scope `payables:write`. A rota impõe o tipo `PAYABLE`.
      operationId: createPayable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialTitleCreate'
            example:
              external_id: PAG-2026-000456
              document_number: FAT-9988
              issue_date: '2026-08-13'
              due_date: '2026-08-20'
              original_amount: '830.50'
              discount_amount: '0.00'
              addition_amount: '0.00'
              currency: BRL
              party:
                type: SUPPLIER
                name: Fornecedor Exemplo
              installment_count: 1
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /payables/{external_id}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Payables]
      summary: Consultar conta a pagar pela identidade externa
      description: Exige `payables:read`; restringe origem autenticada e tipo PAYABLE.
      operationId: getPayable
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Payables]
      summary: Atualizar uma conta a pagar editável
      description: Exige `payables:write`. O external_id vem do path e não pode estar no corpo.
      operationId: updatePayable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialTitleUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /payables/{external_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    post:
      tags: [Payables]
      summary: Cancelar uma conta a pagar sem excluí-la
      description: Exige `payables:write`; títulos com liquidação são rejeitados.
      operationId: cancelPayable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancellation'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /receivables:
    post:
      tags: [Receivables]
      summary: Criar ou reingerir uma conta a receber
      description: Exige o scope `receivables:write`. A rota impõe o tipo `RECEIVABLE`.
      operationId: createReceivable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialTitleCreate'
            example:
              external_id: REC-2026-000123
              document_number: NF-12345
              issue_date: '2026-08-13'
              due_date: '2026-09-13'
              original_amount: '1500.00'
              discount_amount: '0.00'
              addition_amount: '0.00'
              currency: BRL
              party:
                type: CUSTOMER
                name: Cliente Exemplo
              installment_count: 1
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /receivables/{external_id}:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Receivables]
      summary: Consultar conta a receber pela identidade externa
      description: Exige `receivables:read`; restringe origem autenticada e tipo RECEIVABLE.
      operationId: getReceivable
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Receivables]
      summary: Atualizar uma conta a receber editável
      description: Exige `receivables:write`. O external_id vem do path e não pode estar no corpo.
      operationId: updateReceivable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinancialTitleUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /receivables/{external_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExternalId'
    post:
      tags: [Receivables]
      summary: Cancelar uma conta a receber sem excluí-la
      description: Exige `receivables:write`; títulos com liquidação são rejeitados.
      operationId: cancelReceivable
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cancellation'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /bank-transactions:
    post:
      tags: [Bank Transactions]
      summary: Ingerir uma transação bancária canônica
      description: |
        Exige `bank-transactions:write`. A origem vem exclusivamente da credencial.
        Cria um lote canônico de um item. Repetir a identidade forte com o mesmo
        conteúdo retorna decisão `DUPLICATE`; valor e data nunca formam identidade.
      operationId: createBankTransaction
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankTransactionCreate'
            example:
              account_id: 12
              external_id: TX-BANK-20260813-001
              transaction_date: '2026-08-13'
              posted_at: '2026-08-13T09:30:00-03:00'
              direction: CREDIT
              amount: '1250.00'
              currency: BRL
              description: PIX RECEBIDO CLIENTE EXEMPLO
              end_to_end_id: E123456789202608130000000000001
              counterparty:
                name: Cliente Exemplo
      responses:
        '201':
          description: Transação criada.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionEnvelope'
        '200':
          description: Duplicidade forte tratada ou replay idempotente.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /bank-transactions/{account_id}/{external_id}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/ExternalId'
    get:
      tags: [Bank Transactions]
      summary: Consultar uma transação por conta e identidade forte
      description: Exige `bank-transactions:read` e restringe a consulta à origem autenticada.
      operationId: getBankTransaction
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Transação encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankTransactionEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /bank-imports/ofx:
    post:
      tags: [Bank Imports]
      summary: Importar um extrato bancário OFX
      description: |
        Exige `bank-imports:write`. Aceita OFX SGML/XML suportado, com limite padrão
        de 5 MiB configurável por `BANK_IMPORT_OFX_MAX_BYTES`. O hash idempotente
        inclui os bytes do arquivo. O arquivo bruto não é retido.
      operationId: importBankStatementOfx
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [account_id, file]
              properties:
                account_id:
                  type: integer
                  minimum: 1
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Arquivo processado; consulte status e contadores no lote.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchEnvelope'
        '200':
          description: Replay HTTP ou arquivo já processado para a mesma origem e conta.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /bank-imports/{batch_id}:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Bank Imports]
      summary: Consultar um lote de importação bancária
      description: Exige `bank-imports:read`; restringe o lote à origem autenticada e não retorna o arquivo bruto.
      operationId: getBankImportBatch
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lote encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /bank-imports/{batch_id}/items:
    parameters:
      - $ref: '#/components/parameters/BatchId'
    get:
      tags: [Bank Imports]
      summary: Listar itens rastreáveis de um lote
      description: Exige `bank-imports:read`; retorna até 50 itens por página e restringe a origem autenticada.
      operationId: listBankImportBatchItems
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Página de itens do lote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchItemsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Token opaco `acop_...`; scopes pertencem à credencial cadastrada.
      x-scopes:
        - payables:read
        - payables:write
        - receivables:read
        - receivables:write
        - bank-transactions:read
        - bank-transactions:write
        - bank-imports:read
        - bank-imports:write
  parameters:
    ExternalId:
      name: external_id
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
      description: Identificador dentro da origem autenticada.
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Conta bancária legada validada pela aplicação.
    BatchId:
      name: batch_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Identificador interno do lote, sempre isolado pela origem autenticada.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
      description: Chave de um evento lógico; repetir exatamente para recuperar a resposta.
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
      description: Correlação opcional; UUID é gerado quando ausente.
  headers:
    CorrelationId:
      description: Correlação efetiva da operação.
      schema:
        type: string
    IdempotencyReplayed:
      description: "`true` quando a resposta veio da inbox."
      schema:
        type: string
        enum: ['true', 'false']
  schemas:
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]{0,12})\.[0-9]{2}$'
      example: '1500.00'
    Party:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          minimum: 1
          nullable: true
        type:
          type: string
          maxLength: 30
          nullable: true
        name:
          type: string
          maxLength: 191
          nullable: true
    FinancialTitleFields:
      type: object
      additionalProperties: false
      required: [issue_date, due_date, original_amount]
      properties:
        external_id:
          type: string
          maxLength: 128
        document_number:
          type: string
          maxLength: 120
          nullable: true
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        original_amount:
          $ref: '#/components/schemas/Money'
        discount_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          default: '0.00'
        addition_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          default: '0.00'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: BRL
        party:
          $ref: '#/components/schemas/Party'
        account_id:
          type: integer
          minimum: 1
          nullable: true
        category_id:
          type: integer
          minimum: 1
          nullable: true
        cost_center_id:
          type: integer
          minimum: 1
          nullable: true
        installment_count:
          type: integer
          minimum: 1
          maximum: 999
          default: 1
        notes:
          type: string
          maxLength: 10000
          nullable: true
    FinancialTitleCreate:
      allOf:
        - $ref: '#/components/schemas/FinancialTitleFields'
        - type: object
          required: [external_id]
          properties:
            external_id:
              type: string
              maxLength: 128
    FinancialTitleUpdate:
      allOf:
        - $ref: '#/components/schemas/FinancialTitleFields'
        - not:
            required: [external_id]
      description: Mesmo contrato, sem external_id, type, source_system ou campos internos.
    Cancellation:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    Installment:
      type: object
      required: [number, due_date, amount, status]
      properties:
        number:
          type: integer
        due_date:
          type: string
          format: date
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [OPEN, PARTIALLY_SETTLED, SETTLED, CANCELLED]
    FinancialTitle:
      type: object
      required: [id, external_id, type, status, issue_date, due_date, total_amount, currency]
      properties:
        id:
          type: integer
        external_id:
          type: string
        type:
          type: string
          enum: [PAYABLE, RECEIVABLE]
        status:
          type: string
          enum: [OPEN, PARTIALLY_SETTLED, SETTLED, CANCELLED]
        document_number:
          type: string
          nullable: true
        issue_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        original_amount:
          $ref: '#/components/schemas/Money'
        discount_amount:
          $ref: '#/components/schemas/Money'
        addition_amount:
          $ref: '#/components/schemas/Money'
        total_amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        party:
          $ref: '#/components/schemas/Party'
        installment_count:
          type: integer
        installments:
          type: array
          items:
            $ref: '#/components/schemas/Installment'
        notes:
          type: string
          nullable: true
        cancellation:
          type: object
          properties:
            reason:
              type: string
            cancelled_at:
              type: string
              format: date-time
    BankCounterparty:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 191
          nullable: true
        document:
          type: string
          maxLength: 30
          nullable: true
    BankTransactionCreate:
      type: object
      additionalProperties: false
      required: [account_id, external_id, transaction_date, direction, amount, description]
      properties:
        account_id:
          type: integer
          minimum: 1
        external_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Identificador forte fornecido pelo banco ou produtor.
        transaction_date:
          type: string
          format: date
        posted_at:
          type: string
          format: date-time
          nullable: true
        direction:
          type: string
          enum: [CREDIT, DEBIT]
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: BRL
        description:
          type: string
          minLength: 1
          maxLength: 10000
        document_number:
          type: string
          maxLength: 120
          nullable: true
        bank_reference:
          type: string
          maxLength: 191
          nullable: true
        end_to_end_id:
          type: string
          maxLength: 191
          nullable: true
        counterparty:
          $ref: '#/components/schemas/BankCounterparty'
        balance_after:
          type: string
          pattern: '^-?(0|[1-9][0-9]{0,12})\.[0-9]{2}$'
          nullable: true
    BankTransaction:
      type: object
      required: [id, account_id, import_batch_id, external_id, identity_quality, direction, amount, currency, transaction_date, description]
      properties:
        id:
          type: integer
        account_id:
          type: integer
        import_batch_id:
          type: integer
        external_id:
          type: string
        identity_quality:
          type: string
          enum: [STRONG]
        direction:
          type: string
          enum: [CREDIT, DEBIT]
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          type: string
        transaction_date:
          type: string
          format: date
        posted_at:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
        document_number:
          type: string
          nullable: true
        bank_reference:
          type: string
          nullable: true
        end_to_end_id:
          type: string
          nullable: true
        counterparty:
          $ref: '#/components/schemas/BankCounterparty'
        balance_after:
          type: string
          nullable: true
    ImportBatch:
      type: object
      required: [id, account_id, channel, format, status, total_items, imported_items, duplicate_items, rejected_items, correlation_id, started_at]
      properties:
        id:
          type: integer
        account_id:
          type: integer
        channel:
          type: string
          enum: [API, FILE]
        format:
          type: string
          enum: [CANONICAL_API, OFX]
        original_filename:
          type: string
          nullable: true
        status:
          type: string
          enum: [RECEIVED, PROCESSING, COMPLETED, PARTIAL, FAILED]
        total_items:
          type: integer
        imported_items:
          type: integer
        duplicate_items:
          type: integer
        rejected_items:
          type: integer
        period_start:
          type: string
          format: date
          nullable: true
        period_end:
          type: string
          format: date
          nullable: true
        correlation_id:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        failure:
          nullable: true
          type: object
          properties:
            code:
              type: string
            summary:
              type: string
    ImportBatchItem:
      type: object
      required: [id, position, result]
      properties:
        id:
          type: integer
        position:
          type: integer
        external_id:
          type: string
          nullable: true
        bank_transaction_id:
          type: integer
          nullable: true
        result:
          type: string
          enum: [IMPORTED, DUPLICATE, REJECTED]
        error:
          nullable: true
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    BankTransactionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/BankTransaction'
        meta:
          type: object
          required: [correlation_id]
          properties:
            correlation_id:
              type: string
            idempotency_replayed:
              type: boolean
            decision:
              type: string
              enum: [CREATED, DUPLICATE]
    ImportBatchEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ImportBatch'
        meta:
          type: object
          required: [correlation_id]
          properties:
            correlation_id:
              type: string
            idempotency_replayed:
              type: boolean
            decision:
              type: string
              enum: [IMPORTED, FILE_DUPLICATE]
    ImportBatchItemsEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImportBatchItem'
        meta:
          type: object
          required: [correlation_id, pagination]
          properties:
            correlation_id:
              type: string
            pagination:
              type: object
              required: [current_page, per_page, total, last_page]
              properties:
                current_page:
                  type: integer
                per_page:
                  type: integer
                  example: 50
                total:
                  type: integer
                last_page:
                  type: integer
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/FinancialTitle'
        meta:
          type: object
          required: [correlation_id]
          properties:
            correlation_id:
              type: string
            idempotency_replayed:
              type: boolean
            decision:
              type: string
              enum: [CREATED, UPDATED, IGNORED, CANCELLED]
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details, correlation_id]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - VALIDATION_ERROR
                - SOURCE_SYSTEM_INACTIVE
                - RESOURCE_NOT_FOUND
                - METHOD_NOT_ALLOWED
                - IDEMPOTENCY_KEY_REQUIRED
                - IDEMPOTENCY_KEY_REUSED
                - IDEMPOTENCY_REQUEST_IN_PROGRESS
                - TITLE_UPDATE_NOT_ALLOWED
                - TITLE_CANCEL_NOT_ALLOWED
                - TITLE_ALREADY_SETTLED
                - DOMAIN_CONFLICT
                - BANK_ACCOUNT_NOT_FOUND
                - BANK_TRANSACTION_ID_REQUIRED
                - BANK_TRANSACTION_ID_CONFLICT
                - BANK_IMPORT_INVALID_FILE
                - BANK_IMPORT_UNSUPPORTED_FORMAT
                - BANK_IMPORT_TOO_LARGE
                - BANK_IMPORT_FAILED
                - RATE_LIMIT_EXCEEDED
                - INTERNAL_ERROR
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            correlation_id:
              type: string
  responses:
    Created:
      description: Título criado.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Success:
      description: Consulta, atualização, ignorado, cancelamento ou replay concluído.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
        Idempotency-Replayed:
          $ref: '#/components/headers/IdempotencyReplayed'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    BadRequest:
      $ref: '#/components/responses/ErrorBody'
    Unauthenticated:
      $ref: '#/components/responses/ErrorBody'
    Forbidden:
      $ref: '#/components/responses/ErrorBody'
    NotFound:
      $ref: '#/components/responses/ErrorBody'
    Conflict:
      $ref: '#/components/responses/ErrorBody'
    ValidationError:
      $ref: '#/components/responses/ErrorBody'
    PayloadTooLarge:
      $ref: '#/components/responses/ErrorBody'
    RateLimited:
      $ref: '#/components/responses/ErrorBody'
    InternalError:
      $ref: '#/components/responses/ErrorBody'
    ErrorBody:
      description: Erro padronizado.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
